<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Easy Tech Consignaciones - Etiquetas de Precios</title>
  <!-- Cargamos JsBarcode para generación local de códigos de barras vectoriales (SVG) -->
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
  
  <!-- Estilo dinámico inyectado por JS para configurar el tamaño del papel de la impresora de etiquetas en la previsualización del sistema -->
  <style id="dynamic-print-style">
    @media print {
      @page {
        size: 50.8mm 25.4mm; /* Default 2x1 pulgadas */
        margin: 0;
      }
    }
  </style>

  <style>
    /* VARIABLES DE DISEÑO */
    :root {
      --color-primary: #0A192F;      /* Azul Marino Oscuro */
      --color-primary-light: #172A45;/* Azul Marino Intermedio */
      --color-accent: #64FFDA;       /* Turquesa */
      --color-accent-blue: #3A86FF;  /* Azul Eléctrico */
      --color-text-dark: #0A192F;
      --color-text-muted: #607D8B;
      --color-bg-light: #F4F6F9;
      --color-white: #FFFFFF;
      --font-family: 'Outfit', 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      
      /* Variables dinámicas para etiquetas (Default 2"x1" o 50.8mm x 25.4mm) */
      --label-width: 50.8mm;
      --label-height: 25.4mm;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--color-bg-light);
      font-family: var(--font-family);
      color: var(--color-text-dark);
      display: flex;
      min-height: 100vh;
    }

    .simulator-container {
      display: flex;
      width: 100%;
      max-width: 1400px;
      margin: 0 auto;
      padding: 20px;
      gap: 20px;
    }

    /* PANEL DE CONTROL (IZQUIERDA) */
    .control-panel {
      flex: 1;
      max-width: 450px;
      background-color: var(--color-primary);
      color: var(--color-white);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
      display: flex;
      flex-direction: column;
      gap: 20px;
      max-height: 95vh;
      overflow-y: auto;
    }

    .control-panel h2 {
      font-size: 1.4rem;
      color: var(--color-accent);
      border-bottom: 2px solid var(--color-primary-light);
      padding-bottom: 12px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-group label {
      font-size: 0.85rem;
      color: #A8B2D1;
      font-weight: 500;
    }

    .form-group input, .form-group select {
      background-color: var(--color-primary-light);
      border: 1px solid rgba(100, 255, 218, 0.2);
      border-radius: 8px;
      padding: 10px 14px;
      color: var(--color-white);
      font-size: 0.95rem;
      transition: all 0.3s ease;
    }

    .form-group input:focus, .form-group select:focus {
      outline: none;
      border-color: var(--color-accent);
    }

    .btn {
      background-color: var(--color-accent-blue);
      color: var(--color-white);
      border: none;
      padding: 12px 24px;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .btn:hover {
      background-color: #2563EB;
      transform: translateY(-2px);
    }

    .btn-print {
      background-color: var(--color-accent);
      color: var(--color-primary);
    }

    .btn-print:hover {
      background-color: #52E0C4;
    }

    /* TABLA DE EDICIÓN DE PRODUCTOS */
    .products-list-editor {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 10px;
    }

    .product-row-edit {
      display: flex;
      gap: 8px;
      background: var(--color-primary-light);
      padding: 8px;
      border-radius: 6px;
      align-items: center;
    }

    .product-row-edit input {
      padding: 6px;
      font-size: 0.85rem;
      background-color: var(--color-primary);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: white;
      border-radius: 4px;
    }

    .product-row-edit .prod-code { width: 85px; }
    .product-row-edit .prod-name { flex: 2; }
    .product-row-edit .prod-price { flex: 1; width: 60px; text-align: right; }

    /* CONTENEDOR DE PLANILLA DE ETIQUETAS (DERECHA) */
    .preview-panel {
      flex: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: #E5E7EB;
      border-radius: 16px;
      padding: 20px;
      overflow-y: auto;
      max-height: 95vh;
    }

    .sheet-options {
      margin-bottom: 20px;
      background: var(--color-white);
      padding: 10px 20px;
      border-radius: 30px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
      display: flex;
      gap: 15px;
      align-items: center;
      font-size: 0.85rem;
    }

    /* VISTA EN PANTALLA DE LA PLANILLA / ROLLO DE ETIQUETAS */
    .labels-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, var(--label-width));
      gap: 4mm;
      justify-content: center;
      background-color: var(--color-white);
      padding: 15mm;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 210mm; /* A4 width */
      min-height: 297mm; /* A4 height */
      border-radius: 4px;
    }

    /* DISEÑO INDIVIDUAL DE LA ETIQUETA */
    .price-tag {
      width: var(--label-width);
      height: var(--label-height);
      border: 1px dashed #CCCCCC; /* Guía de corte visual en pantalla */
      padding: 1.2mm 2.2mm 4.8mm 2.2mm; /* Aumentamos más el margen inferior para levantar el código de barras */
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background-color: var(--color-white);
      overflow: hidden;
      position: relative;
      user-select: none;
    }

    .tag-top-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
    }

    .tag-brand {
      font-size: 7.5px;
      font-weight: 800;
      color: var(--color-primary);
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .tag-brand span {
      color: var(--color-accent-blue);
    }

    .tag-product-name {
      font-size: 9px;
      font-weight: bold;
      color: #333333;
      line-height: 1.1;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      margin-top: 0.5mm;
      flex-grow: 1;
    }

    .tag-price {
      font-size: 16px;
      font-weight: 900;
      color: #000000;
      display: flex;
      align-items: baseline;
      line-height: 1;
    }

    .tag-price::before {
      content: "$";
      font-size: 10px;
      font-weight: bold;
      margin-right: 1px;
    }

    .tag-barcode-container {
      width: 100%;
      height: 9mm; /* Espacio reservado para el código de barras */
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: visible;
    }

    .tag-barcode-svg {
      width: 100%;
      height: 100%;
    }

    /* ESTILOS DE IMPRESIÓN EXCLUSIVOS PARA IMPRESORA DE ROLLO TÉRMICO ADHESIVO */
    @media print {
      body {
        background-color: #FFFFFF;
        display: block;
        min-height: auto;
      }

      .control-panel,
      .preview-panel,
      .sheet-options {
        background: none !important;
        padding: 0 !important;
        box-shadow: none !important;
      }

      .preview-panel {
        display: block !important;
        max-height: none !important;
        overflow: visible !important;
      }

      .simulator-container {
        display: block !important;
        padding: 0 !important;
        margin: 0 !important;
        max-width: none !important;
      }

      /* Convertimos la rejilla en flujo secuencial de etiquetas en rollo */
      .labels-grid {
        box-shadow: none !important;
        padding: 0 !important;
        margin: 0 !important;
        border-radius: 0 !important;
        width: var(--label-width) !important;
        max-width: none !important;
        min-height: auto !important;
        display: block !important; /* Desactivar grid para que cada etiqueta sea una página individual */
      }

      /* Cada etiqueta es un sticker en el rollo de impresión */
      .price-tag {
        border: none !important; /* Sin bordes guías al imprimir */
        margin: 0 !important;
        width: var(--label-width) !important;
        height: var(--label-height) !important;
        page-break-after: always !important; /* Forzar salto al siguiente sticker */
        page-break-inside: avoid !important;
      }

      aside, .control-panel, .sheet-options {
        display: none !important;
      }
    }
  </style>
</head>
<body>

  <div class="simulator-container">

    <!-- PANEL DE CONTROL (IZQUIERDA) -->
    <div class="control-panel">
      <h2>Easy Tech Consignaciones</h2>
      <p style="font-size: 0.85rem; color: #A8B2D1;">Generador de Etiquetas Térmicas (2"x1" o Similar)</p>

      <!-- TAMAÑO DE ETIQUETA -->
      <div class="form-group">
        <label for="select-label-size">Tamaño de Etiqueta (Papel de Rollo)</label>
        <select id="select-label-size" onchange="setLabelSize(this.value)">
          <option value="50.8x25.4" selected>1" x 2" Pulgadas (50.8mm x 25.4mm)</option>
          <option value="50x25">Mediana (50mm x 25mm)</option>
          <option value="38x25">Estándar (38mm x 25mm)</option>
          <option value="30x15">Mini (30mm x 15mm)</option>
        </select>
      </div>

      <!-- FORMATO DE CÓDIGO DE BARRAS -->
      <div class="form-group">
        <label for="select-barcode-format">Formato de Código de Barras</label>
        <select id="select-barcode-format" onchange="generateLabels()">
          <option value="CODE128">CODE128 (Recomendado, Alfanumérico)</option>
          <option value="EAN13">EAN-13 (13 dígitos numéricos)</option>
          <option value="CODE39">CODE39 (Estándar industrial)</option>
        </select>
      </div>

      <div class="divider" style="border-top: 1px dashed rgba(255,255,255,0.1); margin: 10px 0;"></div>

      <!-- LISTA DE PRODUCTOS A GENERAR -->
      <div>
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
          <h3 style="font-size: 1rem; color: var(--color-accent);">Productos a Imprimir</h3>
          <button class="btn" style="padding: 4px 10px; font-size: 0.75rem;" onclick="addProductRow()">+ Agregar</button>
        </div>
        
        <div class="products-list-editor" id="editor-products-list">
          <!-- Renderizado por JS -->
        </div>
      </div>

      <button class="btn btn-print" style="margin-top: 15px;" onclick="window.print()">
        <span>🖨️ Imprimir Etiquetas</span>
      </button>
    </div>

    <!-- VISTA PREVIA (DERECHA) -->
    <div class="preview-panel">
      
      <div class="sheet-options">
        <span><strong>Previsualización del Rollo Térmico</strong></span>
        <span>|</span>
        <label>
          <input type="checkbox" id="toggle-cut-lines" checked onchange="toggleCutLines(this.checked)"> Guías de corte (solo en pantalla)
        </label>
      </div>

      <!-- PLANILLA / ROLLO -->
      <div class="labels-grid" id="labels-grid-container">
        <!-- Generado dinámicamente -->
      </div>

    </div>

  </div>

  <script>
    // LISTADO INICIAL DE PRODUCTOS PARA LAS ETIQUETAS
    const labelProducts = [
      { id: "75030101", nombre: "Cable USB Tipo C 1m", precio: 80.00 },
      { id: "75030102", nombre: "Cable Lightning 1m", precio: 90.00 },
      { id: "75030103", nombre: "Cargador 20W Carga Rápida", precio: 150.00 },
      { id: "75030104", nombre: "Adaptador Audio 3.5mm", precio: 70.00 },
      { id: "75030105", nombre: "Soporte Magnético Auto", precio: 120.00 },
      { id: "75030106", nombre: "Audífonos In-Ear Básicos", precio: 99.00 }
    ];

    // INICIALIZACIÓN
    function init() {
      setLabelSize(document.getElementById('select-label-size').value);
      renderEditor();
    }

    // AJUSTAR TAMAÑOS DE VARIABLES CSS Y @PAGE PARA LA IMPRESORA TÉRMICA
    function setLabelSize(sizeStr) {
      const [w, h] = sizeStr.split('x');
      
      // Actualizar variables de CSS para visualización en pantalla
      document.documentElement.style.setProperty('--label-width', w + 'mm');
      document.documentElement.style.setProperty('--label-height', h + 'mm');
      
      // Actualizar regla de @page de impresión dinámicamente para que el driver de la impresora térmica
      // de rollo detecte automáticamente la medida de la etiqueta física
      const dynamicStyle = document.getElementById('dynamic-print-style');
      dynamicStyle.innerHTML = `
        @media print {
          @page {
            size: ${w}mm ${h}mm;
            margin: 0;
          }
        }
      `;
      
      generateLabels();
    }

    // APLICAR LÍNEAS GUÍA DE CORTE EN PANTALLA
    function toggleCutLines(checked) {
      const tags = document.querySelectorAll('.price-tag');
      tags.forEach(tag => {
        tag.style.border = checked ? '1px dashed #CCCCCC' : 'none';
      });
    }

    // RENDER DEL EDITOR DE LISTADO (IZQUIERDA)
    function renderEditor() {
      const list = document.getElementById('editor-products-list');
      list.innerHTML = '';

      labelProducts.forEach((prod, index) => {
        const div = document.createElement('div');
        div.className = 'product-row-edit';
        div.innerHTML = `
          <input type="text" class="prod-code" value="${prod.id}" onchange="updateProduct(${index}, 'id', this.value)" placeholder="Código">
          <input type="text" class="prod-name" value="${prod.nombre}" onchange="updateProduct(${index}, 'nombre', this.value)" placeholder="Nombre">
          <input type="number" class="prod-price" value="${prod.precio}" onchange="updateProduct(${index}, 'precio', this.value)" placeholder="Precio">
          <button style="background: none; border: none; color: #FF6B6B; cursor: pointer; font-weight: bold; padding: 0 4px;" onclick="removeProduct(${index})">✕</button>
        `;
        list.appendChild(div);
      });
    }

    function addProductRow() {
      const nextNum = 30107 + labelProducts.length;
      labelProducts.push({
        id: "750" + nextNum,
        nombre: "Nuevo Producto",
        precio: 100.00
      });
      renderEditor();
      generateLabels();
    }

    function updateProduct(index, field, value) {
      if (field === 'precio') {
        labelProducts[index][field] = parseFloat(value) || 0;
      } else {
        labelProducts[index][field] = value;
      }
      generateLabels();
    }

    // ELIMINAR PRODUCTO DE LA LISTA
    function removeProduct(index) {
      labelProducts.splice(index, 1);
      renderEditor();
      generateLabels();
    }

    // GENERAR LA PLANILLA DE ETIQUETAS E INSTANCIAR LOS CÓDIGOS DE BARRAS
    function generateLabels() {
      const grid = document.getElementById('labels-grid-container');
      grid.innerHTML = '';

      const format = document.getElementById('select-barcode-format').value;
      const sizeStr = document.getElementById('select-label-size').value;
      const [widthMm, heightMm] = sizeStr.split('x').map(Number);
      const showCutLines = document.getElementById('toggle-cut-lines').checked;

      // Duplicar elementos solo para simulación en pantalla (no afecta si el usuario solo agrega los necesarios)
      const renderList = [...labelProducts];

      renderList.forEach((prod, idx) => {
        const tag = document.createElement('div');
        tag.className = 'price-tag';
        tag.style.border = showCutLines ? '1px dashed #CCCCCC' : 'none';

        // Validación y formateo de entrada para EAN-13
        let displayId = prod.id;
        if (format === "EAN13") {
          const numericId = prod.id.replace(/\D/g, "");
          if (numericId.length < 12) {
            displayId = numericId.padStart(12, "0");
          } else if (numericId.length > 13) {
            displayId = numericId.substring(0, 13);
          } else {
            displayId = numericId;
          }
        }

        // Estructura interior optimizada para rollos pequeños
        tag.innerHTML = `
          <div class="tag-top-row">
            <div class="tag-brand">EasyTech<span>Supply</span></div>
            <div class="tag-price" style="font-size: ${heightMm < 20 ? '12px' : '15px'}">${prod.precio.toFixed(0)}</div>
          </div>
          <div class="tag-product-name" style="font-size: ${heightMm < 20 ? '7.5px' : '9px'}">${prod.nombre}</div>
          <div class="tag-barcode-container" style="height: ${heightMm * 0.4}mm;">
            <svg class="tag-barcode-svg" id="barcode-svg-${idx}"></svg>
          </div>
        `;

        grid.appendChild(tag);

        // Configuración de JsBarcode
        try {
          let barWidth = 1.1;
          let barHeight = 18;
          let fontSize = 7;

          // Escalado para ajustar exactamente al ancho de 2" (50.8mm) o menor
          if (widthMm <= 30) {
            barWidth = 0.7;
            fontSize = 5;
          } else if (widthMm <= 40) {
            barWidth = 0.9;
            fontSize = 6.5;
          } else {
            barWidth = 1.25;
            barHeight = 20;
            fontSize = 7.5;
          }

          if (heightMm <= 16) {
            barHeight = 12;
            fontSize = 0; // Ocultar el valor humano si no cabe
          }

          JsBarcode(`#barcode-svg-${idx}`, displayId, {
            format: format,
            width: barWidth,
            height: barHeight,
            displayValue: fontSize > 0,
            fontSize: fontSize,
            font: "monospace",
            margin: 0,
            background: "transparent",
            lineColor: "#000000"
          });
        } catch (error) {
          console.error("Error generando código de barras:", error);
          const container = tag.querySelector('.tag-barcode-container');
          container.innerHTML = `<span style="color:red; font-size:6px; font-weight:bold;">ERROR CODE</span>`;
        }
      });
    }

    // Inicializar
    window.onload = init;
  </script>
</body>
</html>
